services:
  chainlit:
    build: .
    container_name: chainlit
    env_file:
      - .env
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - CHAINLIT_HOST=0.0.0.0
      - CHAINLIT_PORT=8000
    command: chainlit run app.py --host 0.0.0.0 --port 8000 -h
    restart: unless-stopped
    networks:
      - chainlit-network

  nginx:
    image: nginx:alpine
    container_name: chainlit-nginx
    ports:
      - "30391:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - chainlit
    networks:
      - chainlit-network
    restart: unless-stopped

networks:
  chainlit-network:
    driver: bridge
